[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-attention-engine"
version = "0.0.0"
description = "Pre-implementation contracts for SCOPE attention systems research"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["scope_engine*"]
exclude = ["legacy*", "tests*", "benchmarks*"]

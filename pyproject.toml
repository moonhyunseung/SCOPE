[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-attention-observatory"
version = "0.0.1"
description = "SCOPE: state-conditioned operator profiling and execution research"
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=2.1", "transformers==5.19.0"]
research = ["numpy>=2.1", "transformers==5.19.0", "huggingface_hub>=1", "PyYAML>=6", "pyarrow>=18", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
include = ["scope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Continuation v2 integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q tests_v2
      - run: python scripts/verify_population_artifacts.py
      - run: python scripts/verify_continuation_v2.py
